<app-modal
  [title]="isEdit() ? 'Edit user' : 'Add user'"
  [subtitle]="isEdit() ? user()?.email : 'The user can sign in as soon as the account is created.'"
  [busy]="saving()"
  (closed)="closed.emit()"
>
  <form id="user-form" class="form-grid" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <app-form-field label="First name" for="uf-first" [control]="form.controls.firstName" [required]="true">
      <input id="uf-first" class="input" formControlName="firstName" autocomplete="given-name"
        [class.is-invalid]="form.controls.firstName.touched && form.controls.firstName.invalid" />
    </app-form-field>

    <app-form-field label="Last name" for="uf-last" [control]="form.controls.lastName" [required]="true">
      <input id="uf-last" class="input" formControlName="lastName" autocomplete="family-name"
        [class.is-invalid]="form.controls.lastName.touched && form.controls.lastName.invalid" />
    </app-form-field>

    <app-form-field class="span-2" label="Email" for="uf-email" [control]="form.controls.email" [required]="true"
      hint="Used to sign in.">
      <input id="uf-email" class="input" type="email" formControlName="email" autocomplete="off"
        [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid" />
    </app-form-field>

    <app-form-field label="Phone" for="uf-phone" [control]="form.controls.phoneNumber" hint="Optional, e.g. +966 55 123 4567">
      <input id="uf-phone" class="input" type="tel" formControlName="phoneNumber" autocomplete="off"
        [class.is-invalid]="form.controls.phoneNumber.touched && form.controls.phoneNumber.invalid" />
    </app-form-field>

    <app-form-field label="Role" for="uf-role" [control]="form.controls.roleId" [required]="true"
      [hint]="isSelf() ? 'You cannot change your own role.' : 'Permissions come from the role.'">
      <select id="uf-role" class="select" formControlName="roleId"
        [class.is-invalid]="form.controls.roleId.touched && form.controls.roleId.invalid">
        <option value="" disabled>Select a role</option>
        @for (role of roles(); track role.id) {
          <option [value]="role.id">{{ role.name }}</option>
        }
      </select>
    </app-form-field>

    @if (!isEdit()) {
      <app-form-field class="span-2" label="Initial password" for="uf-password" [control]="form.controls.password" [required]="true"
        hint="At least 8 characters with upper & lower case, a digit and a symbol.">
        <input id="uf-password" class="input" type="password" formControlName="password" autocomplete="new-password"
          [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid" />
      </app-form-field>
    }

    <div class="field span-2">
      <span class="field-label">Status</span>
      <div class="inline-control">
        <app-toggle-switch label="Active" [checked]="form.controls.isActive.value" [disabled]="form.controls.isActive.disabled"
          (toggled)="setActive($event)" />
        <span class="text-sm">{{ form.controls.isActive.value ? 'Active — can sign in' : 'Inactive — cannot sign in' }}</span>
      </div>
    </div>
  </form>

  <ng-container modal-footer>
    <button type="button" class="btn btn-secondary" [disabled]="saving()" (click)="closed.emit()">Cancel</button>
    <button type="submit" form="user-form" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Saving…' : isEdit() ? 'Save changes' : 'Add user' }}
    </button>
  </ng-container>
</app-modal>
